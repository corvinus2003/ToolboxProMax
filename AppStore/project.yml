# Mac App Store edition: sandboxed, no Download node (APPSTORE flag). Generate the project with:
#   xcodegen generate --spec AppStore/project.yml
# The full edition is still built by scripts/build-app.sh and is not affected by anything here.
name: ToolboxAppStore
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Toolbox:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/ToolboxProMax
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Corvin Ghita. Inspired by Cojo's Toolbox."
    entitlements:
      path: AppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        APP_DISPLAY_NAME: Toolbox Studio
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: io.github.corvinus2003.toolbox
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 83S5G3QWTM
        COMBINE_HIDPI_IMAGES: YES
        # Universal: macOS 26 still runs on some Intel Macs
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
